name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build and publish
        required: true
        default: "1.0.2"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_VERSION }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify release metadata and assets
        run: |
          node -e 'const manifest = require("./manifest.json"); if (manifest.version !== process.env.RELEASE_VERSION) { console.error(`Release ${process.env.RELEASE_VERSION} does not match manifest version ${manifest.version}`); process.exit(1); }'
          git rev-parse --verify "refs/tags/$RELEASE_VERSION"
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release $RELEASE_VERSION already exists."
            exit 0
          fi

          gh release create "$RELEASE_VERSION" \
            --verify-tag \
            --draft \
            --title "$RELEASE_VERSION" \
            --generate-notes \
            main.js manifest.json styles.css
