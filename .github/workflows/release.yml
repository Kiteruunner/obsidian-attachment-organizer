name: Release Obsidian plugin

on:
  push:
    branches:
      - main
    tags:
      - "*"

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify release metadata and assets
        run: |
          node -e 'const manifest = require("./manifest.json"); if (manifest.version !== process.env.GITHUB_REF_NAME) { console.error(`Tag ${process.env.GITHUB_REF_NAME} does not match manifest version ${manifest.version}`); process.exit(1); }'
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css

  publish-1-0-2:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-1.0.2]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify plugin
        run: |
          npm run build
          node -e 'const manifest = require("./manifest.json"); if (manifest.version !== "1.0.2") { console.error(`Manifest version ${manifest.version} is not 1.0.2`); process.exit(1); }'
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Create tag and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/git/refs \
            -f ref='refs/tags/1.0.2' \
            -f sha='${{ github.sha }}'
          gh release create 1.0.2 \
            --title 1.0.2 \
            --generate-notes \
            main.js manifest.json styles.css
